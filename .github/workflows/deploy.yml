name: Deploy Cloud Resume

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Python code
        run: |
          python -m pip install --upgrade pip
          pip install pylint boto3
          find . -name "*.py" -type f | xargs pylint --disable=all --enable=E || true

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd infrastructure
          terraform init

      - name: Terraform Validate
        run: |
          cd infrastructure
          terraform validate

      - name: Terraform Plan
        run: |
          cd infrastructure
          terraform plan -no-color
        continue-on-error: true

  deploy:
    name: Deploy Infrastructure and Frontend
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd infrastructure
          terraform init

      - name: Terraform Apply
        run: |
          cd infrastructure
          terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: terraform_outputs
        run: |
          cd infrastructure
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Update API URL in Frontend
        run: |
          API_URL="${{ steps.terraform_outputs.outputs.api_url }}"
          sed -i "s|https://[a-zA-Z0-9]*.execute-api.[a-z0-9-]*.amazonaws.com/[a-z]*/visitor-count|$API_URL|g" frontend/script.js

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ steps.terraform_outputs.outputs.s3_bucket }}/ \
            --exclude "*.backup" \
            --exclude ".git*" \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront Cache
        if: steps.terraform_outputs.outputs.cloudfront_id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.terraform_outputs.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Infrastructure deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ steps.terraform_outputs.outputs.s3_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway URL**: ${{ steps.terraform_outputs.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.terraform_outputs.outputs.cloudfront_id }}" ]; then
            echo "- **CloudFront Distribution**: ${{ steps.terraform_outputs.outputs.cloudfront_id }}" >> $GITHUB_STEP_SUMMARY
          fi

  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API URL
        id: get_api_url
        run: |
          cd infrastructure
          terraform init
          echo "api_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT

      - name: Test API Endpoint
        run: |
          API_URL="${{ steps.get_api_url.outputs.api_url }}"
          echo "Testing API endpoint: $API_URL"
          
          # Test the visitor counter API
          response=$(curl -s -w "\n%{http_code}" "$API_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ API endpoint is working correctly!"
          else
            echo "❌ API endpoint returned status code: $http_code"
            exit 1
          fi

      - name: Test Results
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
